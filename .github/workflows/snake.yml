name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: kadekgirendra
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=white

      - name: Push Snake to Output Branch
        uses: EndBug/add-and-commit@v9
        with:
          message: "update contribution snake"
          add: "dist/github-contribution-grid-snake.svg"
          new_branch: output
