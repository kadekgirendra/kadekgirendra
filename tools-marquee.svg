<svg viewBox="0 0 700 70" width="700" height="70" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="viewport">
      <rect x="0" y="0" width="700" height="70" />
    </clipPath>
  </defs>

  <rect x="0" y="0" width="700" height="70" fill="#0d0d0d" />

  <g clip-path="url(#viewport)">
    <g id="track">
      <!-- Set 1 -->
      <g transform="translate(0,15)">
        <image href="https://cdn.simpleicons.org/react/FFFFFF" x="0"   y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/javascript/FFFFFF" x="60"  y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/php/FFFFFF" x="120" y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/tailwindcss/FFFFFF" x="180" y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/next.js/FFFFFF" x="240" y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/mysql/FFFFFF" x="300" y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/git/FFFFFF" x="360" y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/figma/FFFFFF" x="420" y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/python/FFFFFF" x="480" y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/laravel/FFFFFF" x="540" y="0" width="40" height="40" />
      </g>
      <!-- Set 2 (duplicate, placed right after set 1 for a seamless loop) -->
      <g transform="translate(600,15)">
        <image href="https://cdn.simpleicons.org/react/FFFFFF" x="0"   y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/javascript/FFFFFF" x="60"  y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/php/FFFFFF" x="120" y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/tailwindcss/FFFFFF" x="180" y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/next.js/FFFFFF" x="240" y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/mysql/FFFFFF" x="300" y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/git/FFFFFF" x="360" y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/figma/FFFFFF" x="420" y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/python/FFFFFF" x="480" y="0" width="40" height="40" />
        <image href="https://cdn.simpleicons.org/laravel/FFFFFF" x="540" y="0" width="40" height="40" />
      </g>

      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="translate"
        from="0 0"
        to="-600 0"
        dur="14s"
        repeatCount="indefinite" />
    </g>
  </g>
</svg>
